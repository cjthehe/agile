name: Python CI

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest --maxfail=1 --disable-warnings -q --cov=src --cov-report=xml