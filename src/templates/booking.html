{% extends "base.html" %}

{% block content %}
<!-- ADD FLATPICKR CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<div class="container mt-4" style="max-width: 600px;">
    <!-- Form Header -->
    <div class="mb-4">
        <a href="/" class="text-decoration-none text-dark fs-4">←</a>
        <h2 class="mt-2 fw-bold">Book Appointment</h2>
        <p class="text-muted">Find your therapist</p>
    </div>

    <!-- Stepper Indicator -->
    <div class="d-flex justify-content-between align-items-center mb-5 position-relative">
        <div class="progress position-absolute w-100" style="height: 2px; z-index: -1;">
            <div id="progressBar" class="progress-bar bg-primary" role="progressbar" style="width: 0%;"></div>
        </div>
        <button class="btn btn-primary rounded-circle step-indicator" id="ind-1">1</button>
        <button class="btn btn-secondary rounded-circle step-indicator" id="ind-2">2</button>
        <button class="btn btn-secondary rounded-circle step-indicator" id="ind-3">3</button>
    </div>

    <form method="POST" action="/book" id="bookingForm">
        
        <!-- ==================== STEP 1: CHOOSE THERAPIST ==================== -->
        <div id="step-1" class="form-step">
            <h5 class="fw-bold mb-3">Choose your therapist</h5>
            
            <div class="mb-4">
                <input type="text" id="counselorSearch" class="form-control rounded-pill" placeholder="Search by name or specialization..." onkeyup="filterCounselors()">
            </div>

            <div class="counselor-list" id="counselorList">
                {% for counselor in counselors %}
                <label class="card mb-3 shadow-sm counselor-card" style="cursor: pointer;">
                    <div class="card-body">
                        <div class="form-check">
                            <input class="form-check-input mt-3 counselor-radio" type="radio" name="counselor" value="{{ counselor.id }}" 
                                data-name="{{ counselor.name }}" 
                                data-specialization="{{ counselor.specialization }}"
                                data-slots='{{ counselor.available_slots | tojson }}' 
                                data-booked='{{ counselor.booked_slots | tojson }}' required>
                            <div class="ms-3 d-flex align-items-center">
                                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex justify-content-center align-items-center fw-bold me-3" style="width: 50px; height: 50px; font-size: 1.2rem;">
                                    {{ counselor.name[0] }}
                                </div>
                                <div class="w-100">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <h6 class="mb-1 fw-bold counselor-name">{{ counselor.name }}</h6>
                                        <small class="badge bg-light text-dark border">{{ counselor.experience }} yrs exp</small>
                                    </div>
                                    <small class="text-muted counselor-spec d-block mb-1">{{ counselor.specialization }}</small>
                                    <small class="text-muted fst-italic" style="font-size: 0.8rem;">{{ counselor.desc }}</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </label>
                {% endfor %}
            </div>

            <div class="text-end mt-4">
                <button type="button" class="btn btn-primary rounded-pill px-4" onclick="nextStep(2)">Next Step</button>
            </div>
        </div>

        <!-- ==================== STEP 2: DATE & TIME ==================== -->
        <div id="step-2" class="form-step d-none">
            <button type="button" class="btn btn-link text-dark text-decoration-none p-0 mb-3" onclick="prevStep(1)">← Change Therapist</button>
            
            <div class="card shadow-sm mb-4">
                <div class="card-body text-center">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex justify-content-center align-items-center fw-bold mx-auto mb-2" style="width: 50px; height: 50px; font-size: 1.2rem;" id="selectedTherapistInitials">T</div>
                    <h6 class="fw-bold mb-0" id="selectedTherapistName">Therapist Name</h6>
                    <small class="text-muted" id="selectedTherapistSpec">Specialization</small>
                </div>
            </div>

            <h5 class="fw-bold mb-3">Select Date & Time</h5>
            
            <!-- CHANGED: Replaced standard date with text input for Flatpickr -->
            <input type="text" id="appointmentDate" class="form-control mb-4 bg-white" name="date" placeholder="Select an available date..." required readonly>
            
            <div class="row g-2" id="timeSlotsContainer">
                <p class="text-muted text-center" id="slotPlaceholder">Please select a date to view available times.</p>
            </div>

            <div class="text-end mt-4">
                <button type="button" class="btn btn-primary rounded-pill px-4" onclick="nextStep(3)">Next Step</button>
            </div>
        </div>

        <!-- ==================== STEP 3: CONFIRMATION ==================== -->
        <div id="step-3" class="form-step d-none">
            <button type="button" class="btn btn-link text-dark text-decoration-none p-0 mb-3" onclick="prevStep(2)">← Change Date & Time</button>
            
            <h5 class="fw-bold mb-3">Appointment Type</h5>
            <div class="mb-4">
                <label class="card mb-2 shadow-sm" style="cursor: pointer;">
                    <div class="card-body p-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="appointment_type" value="In-person" checked>
                            <span class="ms-2">👥 In-person</span>
                        </div>
                    </div>
                </label>
                <label class="card shadow-sm" style="cursor: pointer;">
                    <div class="card-body p-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="appointment_type" value="Phone call">
                            <span class="ms-2">📞 Phone call</span>
                        </div>
                    </div>
                </label>
            </div>

            <button type="submit" class="btn btn-success w-100 rounded-pill py-2 fw-bold">Confirm Appointment Booking</button>
        </div>
    </form>
</div>

<!-- ADD FLATPICKR JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
    // Map string days from your DB to JavaScript Date integers (0=Sun, 1=Mon, etc)
    const dayMap = {
        "Sunday": 0, "Monday": 1, "Tuesday": 2, "Wednesday": 3, 
        "Thursday": 4, "Friday": 5, "Saturday": 6
    };

    // Store the flatpickr instance so we can destroy/recreate it when therapist changes
    let datePickerInstance = null;

    function filterCounselors() {
        let input = document.getElementById('counselorSearch').value.toLowerCase();
        let cards = document.getElementsByClassName('counselor-card');
        for (let i = 0; i < cards.length; i++) {
            let name = cards[i].querySelector('.counselor-name').innerText.toLowerCase();
            let spec = cards[i].querySelector('.counselor-spec').innerText.toLowerCase();
            cards[i].style.display = (name.includes(input) || spec.includes(input)) ? "" : "none";
        }
    }

    function nextStep(step) {
    if (step === 2) {
        let selected = document.querySelector('input[name="counselor"]:checked');
        if (!selected) return alert("Please select a therapist first.");
        
        document.getElementById('selectedTherapistName').innerText = selected.getAttribute('data-name');
        document.getElementById('selectedTherapistSpec').innerText = selected.getAttribute('data-specialization');
        document.getElementById('selectedTherapistInitials').innerText = selected.getAttribute('data-name').charAt(0);
        
        let availabilityRules = JSON.parse(selected.getAttribute('data-slots'));
        
        // GRAB THE BOOKED SLOTS
        let bookedSlots = JSON.parse(selected.getAttribute('data-booked'));
        
        let allowedDays = availabilityRules.map(rule => dayMap[rule.day]);

        document.getElementById('timeSlotsContainer').innerHTML = "<p class='text-muted text-center'>Please select a date to view available times.</p>";
        document.getElementById('appointmentDate').value = "";

        if (datePickerInstance) datePickerInstance.destroy();
        
        datePickerInstance = flatpickr("#appointmentDate", {
            minDate: "today",
            enable: [ function(date) { return allowedDays.includes(date.getDay()); } ],
            onChange: function(selectedDates, dateStr, instance) {
                // PASS BOOKED SLOTS TO THE GENERATOR
                generateTimeSlots(selectedDates[0], availabilityRules, bookedSlots);
            }
        });
    }
    
    if (step === 3) {
        let date = document.querySelector('input[name="date"]').value;
        let slot = document.querySelector('input[name="slot"]:checked');
        if (!date || !slot) return alert("Please select a date and a time slot.");
    }

    updateUI(step);
}

function generateTimeSlots(selectedDate, availabilityRules, bookedSlots) {
    let container = document.getElementById('timeSlotsContainer');
    container.innerHTML = "";

    let dayOfWeekInt = selectedDate.getDay();
    let dayName = Object.keys(dayMap).find(key => dayMap[key] === dayOfWeekInt);

    let rule = availabilityRules.find(r => r.day === dayName);
    if (!rule) return;

    // Format the JS Date into YYYY-MM-DD so we can compare it to the database
    let year = selectedDate.getFullYear();
    let month = String(selectedDate.getMonth() + 1).padStart(2, '0');
    let day = String(selectedDate.getDate()).padStart(2, '0');
    let datePrefix = `${year}-${month}-${day}`;

    let startHour = parseInt(rule.start_time.split(':')[0]);
    let endHour = parseInt(rule.end_time.split(':')[0]);

    for (let h = startHour; h < endHour; h += 2) {
        let ampm = h >= 12 ? 'pm' : 'am';
        let displayHour = h % 12 || 12;
        let slotLabel = `${displayHour}.00 ${ampm}`;

        // Ensure hour string is 2 digits (e.g., "09" instead of "9")
        let hourString = String(h).padStart(2, '0');
        
        // Check if ANY booked slot matches this specific date AND this specific hour
        let isBooked = bookedSlots.some(booked => 
            booked.includes(datePrefix) && booked.includes(`${hourString}:00:00`)
        );

        // Apply disabled styles if the slot is taken
        let disabledAttr = isBooked ? "disabled" : "";
        let btnClass = isBooked ? "btn-outline-secondary" : "btn-outline-primary";
        let textClass = isBooked ? "text-decoration-line-through text-muted" : "";
        let labelSuffix = isBooked ? "(Upcoming)" : "";

        let html = `
        <div class="col-12 col-md-6 mb-2">
            <input type="radio" class="btn-check" name="slot" id="slot-${h}" value="${slotLabel}" ${disabledAttr} required>
            <label class="btn ${btnClass} w-100 rounded-pill py-2 ${textClass}" for="slot-${h}">${slotLabel} ${labelSuffix}</label>
        </div>`;
        container.innerHTML += html;
    }

    if(container.innerHTML === "") {
        container.innerHTML = "<p class='text-muted'>No slots fit this timeframe.</p>";
    }
}

    function prevStep(step) { updateUI(step); }

    function updateUI(step) {
        document.querySelectorAll('.form-step').forEach(el => el.classList.add('d-none'));
        document.getElementById(`step-${step}`).classList.remove('d-none');
        
        document.querySelectorAll('.step-indicator').forEach((btn, index) => {
            btn.classList.toggle('btn-primary', index + 1 <= step);
            btn.classList.toggle('btn-secondary', index + 1 > step);
        });

        document.getElementById('progressBar').style.width = `${(step - 1) * 50}%`;
    }
</script>

<style>
    .counselor-card:has(input:checked) {
        border: 2px solid #0d6efd;
        background-color: #f8f9fa;
    }
</style>
{% endblock %}
