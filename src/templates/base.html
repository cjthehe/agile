<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCare Clinic</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa; /* Soft light gray background */
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Ensures the footer stays at the bottom */
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .main-content {
            flex: 1; /* Pushes the footer down naturally */
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top py-3">
        <div class="container d-flex justify-content-between align-items-center">
            
            <a class="navbar-brand text-primary d-flex align-items-center" href="/">
                <span class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex justify-content-center align-items-center me-2" style="width: 40px; height: 40px; font-size: 1.2rem;">
                    🌿
                </span>
                MindCare Clinic
            </a>

            <div>
                <a id="loginLink" class="btn btn-outline-primary rounded-pill px-4 fw-medium" href="/login">Login</a>
                <button id="logoutButton" class="btn btn-primary rounded-pill px-4 fw-medium d-none">Logout</button>
            </div>
            
        </div>
    </nav>

    <main class="container main-content mt-5 mb-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-white border-top py-4 mt-auto">
        <div class="container text-center">
            <small class="text-muted fw-medium">&copy; 2026 MindCare Clinic Management System. All rights reserved.</small>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
