{% extends "base.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-sm p-4" style="max-width: 450px; width: 100%; border-radius: 15px;">
        <h3 class="text-center mb-1">Reset Password</h3>
        <p class="text-center text-muted mb-4">Regain access to your account</p>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <div id="step1">
            <div class="mb-3">
                <label for="emailInput" class="form-label">Email address</label>
                <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" required>
            </div>
            <button id="sendCodeBtn" class="btn btn-primary w-100 rounded-pill mb-3" onclick="requestCode()">
                Send Verification Code
            </button>
            <div class="text-center">
                <a href="/login" class="text-decoration-none text-muted">← Back to Login</a>
            </div>
        </div>

        <div id="step2" class="d-none">
            <div class="mb-3">
                <label for="codeInput" class="form-label">6-Digit Code</label>
                <input type="text" class="form-control text-center letter-spacing-2" id="codeInput" placeholder="------" maxlength="6" required>
            </div>
            <div class="mb-3">
                <label for="newPasswordInput" class="form-label">New Password</label>
                <input type="password" class="form-control" id="newPasswordInput" placeholder="At least 8 characters" required>
            </div>
            <button id="resetBtn" class="btn btn-success w-100 rounded-pill mb-3" onclick="submitReset()">
                Confirm New Password
            </button>
        </div>
    </div>
</div>

<script>
    const emailInput = document.getElementById('emailInput');
    const alertBox = document.getElementById('alertBox');
    
    function showAlert(message, type) {
        alertBox.className = `alert alert-${type}`;
        alertBox.innerText = message;
    }

    async function requestCode() {
        const email = emailInput.value.trim();
        if (!email) return showAlert("Please enter your email.", "danger");

        const btn = document.getElementById('sendCodeBtn');
        btn.innerText = "Sending...";
        btn.disabled = true;

        try {
            const res = await fetch('/api/request-reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });
            const data = await res.json();

            if (res.ok) {
                showAlert(data.message, "success");
                // Hide Step 1, Show Step 2
                document.getElementById('step1').classList.add('d-none');
                document.getElementById('step2').classList.remove('d-none');
            } else {
                showAlert(data.message, "danger");
            }
        } catch (error) {
            showAlert("Connection error. Please try again.", "danger");
        } finally {
            btn.innerText = "Send Verification Code";
            btn.disabled = false;
        }
    }

    async function submitReset() {
        const email = emailInput.value.trim();
        const code = document.getElementById('codeInput').value.trim();
        const newPassword = document.getElementById('newPasswordInput').value;

        if (!code || !newPassword) return showAlert("Please fill out all fields.", "danger");

        const btn = document.getElementById('resetBtn');
        btn.innerText = "Resetting...";
        btn.disabled = true;

        try {
            const res = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    email: email, 
                    code: code, 
                    new_password: newPassword 
                })
            });
            const data = await res.json();

            if (res.ok) {
                showAlert(data.message, "success");
                // Redirect back to login after 2 seconds
                setTimeout(() => window.location.href = "/login", 2000);
            } else {
                showAlert(data.message, "danger");
                btn.innerText = "Confirm New Password";
                btn.disabled = false;
            }
        } catch (error) {
            showAlert("Connection error. Please try again.", "danger");
            btn.innerText = "Confirm New Password";
            btn.disabled = false;
        }
    }
</script>
{% endblock %}
